[pytest]
testpaths = tests
# Only collect test_*.py -- NOT *_test.py, which would also match
# tests/openrouter_key_test.py and tests/github_token_test.py. Those are standalone
# scripts with live-network top-level code (not pytest tests), meant to be run
# directly, not collected -- the default *_test.py pattern would otherwise import
# and execute them as a side effect of collection, making live API calls and
# hard-crashing collection entirely if the relevant key isn't set in .env.
python_files = test_*.py
